name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install # 如果没有 package-lock.json 先用这个
        # 如果有 package-lock.json，改回 npm ci

      - name: Build
        run: npm run build -- --base=/personal-work-collections/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist # 确认你的构建输出目录是 dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
