  <!-- site nav -->
  <rect x="70" y="52" width="11" height="11" rx="3" fill="#ffffffe0"/>
  <rect x="88" y="54" width="42" height="8" rx="4" fill="#ffffff5c"/>
  <rect x="566" y="55" width="30" height="7" rx="3.5" fill="#ffffff2e"/>
