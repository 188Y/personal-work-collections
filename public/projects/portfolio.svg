  <rect x="136" y="356" width="4" height="6" rx="2" fill="#ffffff24"/>
  <rect x="150" y="356" width="72" height="6" rx="3" fill="#ffffff2e"/>
  <rect x="232" y="356" width="4" height="6" rx="2" fill="#ffffff24"/>
  <rect x="246" y="356" width="48" height="6" rx="3" fill="#ffffff2e"/>

  <!-- avatar inside a single hairline ring -->
  <circle cx="612" cy="200" r="86" fill="#ffffff08"/>
  <circle cx="612" cy="200" r="86" fill="none" stroke="#ffffff73" stroke-width="1.5"/>
  <circle cx="612" cy="182" r="26" fill="#ffffff26"/>
