  <rect x="692" y="55" width="38" height="7" rx="3.5" fill="#ffffffcc"/>
  <rect x="70" y="86" width="660" height="1" fill="#ffffff14"/>

  <!-- hero copy -->
  <rect x="70" y="126" width="86" height="8" rx="4" fill="#ffffff3d"/>
  <rect x="70" y="152" width="288" height="26" rx="4" fill="#ffffffd9"/>
  <rect x="70" y="188" width="182" height="26" rx="4" fill="#ffffff59"/>
  <rect x="70" y="238" width="316" height="8" rx="4" fill="#ffffff2e"/>
